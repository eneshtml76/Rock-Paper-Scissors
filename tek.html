<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="tek.css">
</head>

<body>


<header>
    <h1 class="top">🎮 Rock Paper Scissors</h1>
</header>



<main class="game">


<section class="card">

    <h2>Choose Your Move</h2>


    <div class="btns">

        <button onclick="play('rock')">
            🪨 Rock
        </button>


        <button onclick="play('paper')">
            📄 Paper
        </button>


        <button onclick="play('scissors')">
            ✂️ Scissors
        </button>


    </div>


</section>




<section class="card">


<h2>Result</h2>


<p id="result">
Start the game 🎯
</p>


<h3 id="round">
Round: 0 / 5
</h3>


<h3 id="score">
👤 You: 0 | 🤖 Computer: 0
</h3>



<button id="restart" onclick="restartGame()">

🔄 Play Again

</button>


</section>



</main>



<footer>

<p>Made with HTML CSS JavaScript 🚀</p>

</footer>



<script src="solo.js"></script>


</body>

</html>
